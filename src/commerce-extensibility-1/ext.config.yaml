# The [pre-app-build] hooks are auto-generated. Do not remove or manually edit.
hooks:
  pre-app-build: EXTENSION=extensibility/1 npx aio-commerce-lib-app hooks pre-app-build

events:
  registrations:
    Magazine product refresh consumer:
      description: Refresh magazine shoppable product cache on Commerce product save events
      events_of_interest:
        - provider_metadata: dx_commerce_events
          event_codes:
            - com.adobe.commerce.magazine_editorial_hub.observer.catalog_product_save_commit_after
      runtime_action: magazine/sync-shoppable-product

operations:
  # These worker processes definitions are auto-generated. Do not remove or manually edit.
  workerProcess:
    - type: action
      impl: app-management/app-config
    - type: action
      impl: magazine/get-magazine-articles
    - type: action
      impl: magazine/sync-master-data
    - type: action
      impl: magazine/sync-shoppable-product

runtimeManifest:
  packages:
    # This package definition is auto-generated. Do not remove or manually edit.
    app-management:
      license: Apache-2.0
      actions:
        app-config:
          function: .generated/actions/app-management/app-config.js
          web: yes
          runtime: nodejs:22
          inputs:
            LOG_LEVEL: $LOG_LEVEL
          annotations:
            require-adobe-auth: true
            final: true

    magazine:
      license: Apache-2.0
      actions:
        get-magazine-articles:
          function: actions/get-magazine-articles/index.js
          web: yes
          runtime: nodejs:22
          inputs:
            LOG_LEVEL: $LOG_LEVEL
            IO_STATE_KEY: $IO_STATE_KEY
            MESH_ENDPOINT: $MESH_ENDPOINT
          annotations:
            require-adobe-auth: false
            final: true
        sync-master-data:
          function: actions/sync-master-data/index.js
          web: no
          runtime: nodejs:22
          inputs:
            LOG_LEVEL: $LOG_LEVEL
            IO_STATE_KEY: $IO_STATE_KEY
            MESH_ENDPOINT: $MESH_ENDPOINT
          annotations:
            require-adobe-auth: true
            final: true
        sync-shoppable-product:
          function: actions/sync-shoppable-product/index.js
          web: no
          runtime: nodejs:22
          inputs:
            LOG_LEVEL: $LOG_LEVEL
            IO_STATE_KEY: $IO_STATE_KEY
          annotations:
            require-adobe-auth: true
            final: true
        admin-list-articles:
          function: actions/admin-list-articles/index.js
          web: yes
          runtime: nodejs:22
          inputs:
            LOG_LEVEL: $LOG_LEVEL
            IO_STATE_KEY: $IO_STATE_KEY
            MESH_ENDPOINT: $MESH_ENDPOINT
          annotations:
            require-adobe-auth: true
            final: true
        admin-save-article:
          function: actions/admin-save-article/index.js
          web: yes
          runtime: nodejs:22
          inputs:
            LOG_LEVEL: $LOG_LEVEL
            IO_STATE_KEY: $IO_STATE_KEY
            MESH_ENDPOINT: $MESH_ENDPOINT
          annotations:
            require-adobe-auth: true
            final: true
